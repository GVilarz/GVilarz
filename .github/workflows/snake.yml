name: Generate Snake

on:
  schedule:
    # Executa a cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Baixa o repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Gera as animações da cobrinha (Modo Claro e Modo Escuro)
      - name: Generate the snake game from a github contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: GVilarz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3b82f6&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff

      # Envia os SVGs gerados para o branch "output"
      - name: Push snake svg
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
